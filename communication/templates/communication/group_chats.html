<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group Chats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Available Group Chats</h1>
        {% if tasks %}
            <ul class="list-group">
                {% for task in tasks %}
                    <li class="list-group-item">
                        <a href="{% url 'communication:task_communication_view' task.id %}?mode=chat">Group Chat (Task {{ task.id }}: {{ task.title }})</a>
                        <a href="{% url 'communication:task_communication_view' task.id %}?mode=video" class="ms-3">Group Video</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No active tasks available for group chat.</p>
        {% endif %}
        <a href="{% url 'user:home' %}" class="btn btn-secondary mt-3">Back to Home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
