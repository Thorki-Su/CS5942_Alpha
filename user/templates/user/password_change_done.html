{% extends "base.html" %}

{% block title %}Password changed successfully{% endblock %}

{% block style %}
<style>
  .password-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }
  .password-header {
    background: #30574e;
    color: white;
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 30px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }
  .password-header h2 {
    margin: 0;
    font-size: 2.5rem;
    font-weight: 500;
  }
  .back-link {
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-block;
    margin-top: 15px;
  }
  .back-link:hover {
    background: rgba(255,255,255,0.3);
    color: white;
    text-decoration: none;
  }
</style>
{% endblock %}

{% block content %}
  <div class="password-container">
    <div class="password-header">
      <h2>Password changed successfully</h2>
      <br><p><a href="{% url 'user:home' %}" class="back-link">Back to home page</a></p>
    </div>
  </div>
{% endblock %}
