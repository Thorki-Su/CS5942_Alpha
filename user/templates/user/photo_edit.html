{% extends "base.html" %}

{% block title %}Profile Photo Edit{% endblock %}

{% block style %}
<style>
    .photo-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    .photo-header {
        background: #30574e;
        color: white;
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 30px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .photo-header h2 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 500;
    }
    .photo-form {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        border-left: 4px solid #30574e;
    }
    .button-group {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }
    .button-group button {
        flex: 1;
        background: #30574e;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .button-group button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    .button-group button:hover:enabled {
        background: white;
        color: #30574e;
        border: 2px solid #30574e;
    }
</style>
{% endblock %}

{% block content %}
    <div class="photo-container">
        <div class="photo-header">
            <h2>Edit Your Photo</h2>
        </div>

        <form method="post" enctype="multipart/form-data" class="photo-form">
            {% csrf_token %}

            {{ form.profile_photo.label_tag }}
            <input type="file" id="id_profile_photo" name="profile_photo" accept="image/*">

            <div>
                <img id="cropper_image" style="max-width:100%; margin-top:20px;">
            </div>

            <input type="hidden" id="cropped_image_data" name="cropped_image_data">

            <br>
            <div class="button-group">
                <button type="button" id="crop_button">Crop & Preview</button>
                <button type="submit" id="save_button" disabled>Save</button>
                {% comment %} <input type="submit" value="Save" id="save_button" disabled> {% endcomment %}
            </div>

        </form>
    </div>

    <link  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        let cropper;
        const input = document.getElementById('id_profile_photo');
        const image = document.getElementById('cropper_image');
        const cropButton = document.getElementById('crop_button');
        const croppedImageData = document.getElementById('cropped_image_data');

        cropButton.addEventListener('click', () => {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({
                    width: 300,
                    height: 300
                });
                // 把裁剪后的图像转成 base64，存在隐藏 input 里
                croppedImageData.value = canvas.toDataURL('image/jpeg');
                // 显示预览
                image.src = croppedImageData.value;
                // 解锁 Save 按钮
                document.getElementById('save_button').disabled = false;
            }
        });

        input.addEventListener('change', (e) => {
            const files = e.target.files;
            const done = (url) => {
                image.src = url;
                if (cropper) {
                    cropper.destroy();
                }
                cropper = new Cropper(image, {
                    aspectRatio: 1, // 1:1 正方形头像
                    viewMode: 1,
                    movable: true,
                    zoomable: true,
                    rotatable: false,
                    scalable: false,
                    responsive: true
                });
            };
            
            if (files && files.length > 0) {
                const file = files[0];
                const url = URL.createObjectURL(file);
                done(url);
            }
        });

        cropButton.addEventListener('click', () => {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({
                    width: 300,
                    height: 300
                });
                // 把裁剪后的图像转成 base64，存在隐藏 input 里
                croppedImageData.value = canvas.toDataURL('image/jpeg');
                // 显示预览
                image.src = croppedImageData.value;
            }
        });
    </script>
{% endblock %}
